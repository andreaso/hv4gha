---

name: Lint and Test

on: push

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        py_version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        dependencies: ["constrained", "unconstrained"]

    env:
      UV_MANAGED_PYTHON: true
      UV_PYTHON: ${{ matrix.py_version }}
      UV_RESOLUTION: ${{ matrix.dependencies == 'constrained' && 'lowest-direct' || 'highest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: debug output
        run: export

      - name: Install dependencies
        run: uv sync

      - name: Check ruff formating
        run: uv run ruff format --diff hv4gha/ integration/ tests/

      - name: Check ruff linting
        run: uv run ruff check hv4gha/ integration/ tests/

      - name: Verify type hints
        run: uv run mypy --strict hv4gha/ integration/ tests/

      - name: Run Pytest
        run: uv run pytest

  secondary:
    name: Secondary linting
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Secondary Linters
        uses: andreaso/setup-secondary-linters@537e600c179acebb04008c58de2b20518ff54aa8 # v0.1

      - name: Analyze GitHub Actions
        run: zizmor --format=github .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint integration testing Dockerfile
        run: hadolint --ignore DL3013 integration/Dockerfile

      - name: Markdown lint README
        run: markdownlint --disable MD012 MD013 -- README.md
