[project]
name = "hv4gha"
version = "0.4.1"
description = "Use HashiCorp Vault to manage a GitHub App's private RSA key."
authors = [{name = "Andreas Olsson", email = "andreas@arrakis.se"}]
dependencies = [
  "certifi (>=2025.10.5)",
  "cffi (>=2.1.1)",
  "cryptography (>=43.0.1)",
  "requests (>=2.31.0,<3)",
  "pydantic (>=2.12.0,<3)",
]
requires-python = ">=3.10, <3.16"
readme = "README.md"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
repository = "https://github.com/andreaso/hv4gha"

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
types-requests = "^2.31.0.20240406"
pytest = "^9.1.1"
ruff = "^0.16.9"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
  "FLY002", # https://docs.astral.sh/ruff/rules/static-join-to-f-string/
  "TRY004", # https://docs.astral.sh/ruff/rules/type-check-without-type-error/
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
