[project]
name = "hv4gha"
version = "0.4.1"
description = "Use HashiCorp Vault to manage a GitHub App's private RSA key."
authors = [{name = "Andreas Olsson", email = "andreas@arrakis.se"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "certifi (>=2025.10.5)",
  "cffi (>=2.1.1)",
  "cryptography (>=43.0.1)",
  "requests (>=2.31.0,<3)",
  "pydantic (>=2.14.0,<3)",
]
requires-python = ">=3.11, <3.15"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
repository = "https://github.com/andreaso/hv4gha"

[dependency-groups]
dev = [
  "mypy (>=2.3.1,<3)",
  "types-requests (>=2.31.0.20240406,<3)",
  "pytest (>=9.1.1,<10)",
  "ruff (>=0.16.9,<0.17)",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "FLY002", # https://docs.astral.sh/ruff/rules/static-join-to-f-string/
  "TRY004", # https://docs.astral.sh/ruff/rules/type-check-without-type-error/
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
